# Сайт: rinulik.neeklo.ru (Vite/React SPA)
# Копия: /etc/nginx/sites-available/rinulik.neeklo.ru
# ln -sf ... /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
#
# Отдельный server_name и --cert-name rinulik.neeklo.ru — не затирают чужие сертификаты.

server {
    listen 80;
    listen [::]:80;
    server_name rinulik.neeklo.ru;

    root /var/www/rinulik.neeklo.ru;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/rinulik.neeklo.ru;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    access_log /var/log/nginx/rinulik.neeklo.ru.access.log;
    error_log  /var/log/nginx/rinulik.neeklo.ru.error.log;
}

# После: certbot certonly --webroot -w /var/www/rinulik.neeklo.ru -d rinulik.neeklo.ru --cert-name rinulik.neeklo.ru
# добавьте отдельный server { listen 443 ssl ... } с путями только к:
#   /etc/letsencrypt/live/rinulik.neeklo.ru/fullchain.pem
#   /etc/letsencrypt/live/rinulik.neeklo.ru/privkey.pem
# и при необходимости второй server на :80 с return 301 https://$host$request_uri;
# (шаблон см. deploy/DEPLOY.md)
