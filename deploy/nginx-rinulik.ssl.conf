# rinulik.neeklo.ru — типовая схема: HAProxy :443 (SNI) → nginx 127.0.0.1:9443
# Добавьте строку в /var/lib/haproxy/sni-web.map:
#   rinulik.neeklo.ru	bk_nginx
# Затем: systemctl reload haproxy
#
# Публичный :80 — ACME + редирект на HTTPS (клиент → nginx напрямую).

server {
    listen 127.0.0.1:9443 ssl http2;
    listen [::1]:9443 ssl http2;
    server_name rinulik.neeklo.ru;

    ssl_certificate     /etc/letsencrypt/live/rinulik.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinulik.neeklo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/rinulik.neeklo.ru;
    index index.html;

    client_max_body_size 120m;

    # API и загрузки — с Node (PM2 :4010); статика SPA — из root выше.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    access_log /var/log/nginx/rinulik.neeklo.ru.access.log;
    error_log  /var/log/nginx/rinulik.neeklo.ru.error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name rinulik.neeklo.ru;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/rinulik.neeklo.ru;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
