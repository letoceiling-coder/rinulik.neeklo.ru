# Подключить ПОСЛЕ успешного certonly с --cert-name rinulik.neeklo.ru
# Вставить в тот же файл sites-available/rinulik.neeklo.ru ПОСЛЕ HTTP-сервера
# или заменить одним файлом оба блока. nginx -t перед reload.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rinulik.neeklo.ru;

    ssl_certificate     /etc/letsencrypt/live/rinulik.neeklo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinulik.neeklo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/rinulik.neeklo.ru;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    access_log /var/log/nginx/rinulik.neeklo.ru.access.log;
    error_log  /var/log/nginx/rinulik.neeklo.ru.error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name rinulik.neeklo.ru;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/rinulik.neeklo.ru;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
